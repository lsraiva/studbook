# fly.io — one machine, one volume, one command: fly launch --no-deploy && fly deploy
app = "studbook"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "studbook_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[checks.health]
  type = "http"
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
