# fly.toml app configuration file generated for studbook on 2026-11-18T21:15:47Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'studbook-luann'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  PORT = '8080'
  # F0-02: official results are decided by the causal race. To go back, set 'legacy' and deploy:
  # removing the line does NOT switch rooms back, because each room remembers its engine.
  STUDBOOK_RACE_ENGINE = 'causal'

[[mounts]]
  source = 'studbook_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[checks]
  [checks.health]
    type = 'http'
    interval = '30s'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
