# Render blueprint — New > Blueprint, point it at this repo.
services:
  - type: web
    name: studbook
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATA_DIR
        value: /data
    disk:
      name: studbook-data
      mountPath: /data
      sizeGB: 1
