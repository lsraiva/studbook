name: tests
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node tests/engine.test.mjs
      - run: node --check assets/engine.js && node --check assets/ui.js
